# Gradle daemon 的堆。默认约 512MB，AGP 9 + Kotlin 2.4 + Compose 的 release 构建不够用，
# 会导致 GC thrashing 后 daemon 被强制停止。
# 机器内存 8GB 以下时把 Xmx 降到 3072m 更稳。
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true

# Kotlin 编译守护进程独立占一份内存，单独限制，避免和 Gradle daemon 抢。
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
